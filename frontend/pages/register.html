<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - CareerConnect</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">
                CareerConnect
            </div>

            <ul class="nav-links">

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="jobs.html">
                        Jobs
                    </a>
                </li>

                

            </ul>

            <div class="nav-buttons">

                <a href="login.html"
                   class="login-btn">
                    Login
                </a>

                <a href="register.html"
                   class="register-btn">
                    Register
                </a>

            </div>

        </nav>

    </header>


    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>
                    Create Your Account
                </h1>

                <p class="auth-subtitle">
                    Join CareerConnect and start your career journey.
                </p>


               <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="role">
                            Register As
                        </label>

                        <select id="role" required>

                            <option value="">
                                Select your role
                            </option>

                            <option value="job_seeker">
                                Job Seeker
                            </option>

                            <option value="employer">
                                Employer
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="primary-btn auth-btn">

                        Create Account

                    </button>

                </form>


                <p class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 CareerConnect. All rights reserved.
        </p>

    </footer>
<script>

    const registerForm = document.getElementById("registerForm");

    registerForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        try {

            const response = await fetch(
    "https://careerconnect-ijro.onrender.com/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password,
                        role: role
                    })
                }
            );

            const data = await response.json();

            if (data.success) {

                alert("Registration successful!");

                window.location.href = "login.html";

            } else {

                alert(data.message);

            }

        } catch (error) {

            console.error("Registration error:", error);

            alert(
                "Unable to connect to server. Please try again."
            );

        }

    });

</script>
</body>

</html>
